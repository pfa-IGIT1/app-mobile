<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mesh">
  <!-- Symbole : le M dessine comme un reseau maille (noeuds relies) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- pont superieur (lien de maillage secondaire) -->
    <line x1="24" y1="40" x2="184" y2="40" stroke="#34C88E" stroke-width="7" opacity="0.9"/>
    <!-- traits principaux du M -->
    <path d="M24 168 L24 40 L104 120 L184 40 L184 168" stroke="#1D9E75" stroke-width="12"/>
  </g>
  <!-- noeuds -->
  <g fill="#1D9E75">
    <circle cx="24" cy="168" r="13"/>
    <circle cx="24" cy="40" r="13"/>
    <circle cx="184" cy="40" r="13"/>
    <circle cx="184" cy="168" r="13"/>
  </g>
  <circle cx="104" cy="120" r="16" fill="#34C88E"/>
  <!-- Wordmark : forme "Mesh" avec le symbole en M -->
  <text x="212" y="160" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="140" font-weight="600" letter-spacing="-3" fill="#122019">esh</text>
</svg>
